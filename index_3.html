<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mural de Amistad — ProBarranquilla</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap');

  :root {
    --paper: #EDE6DA;
    --paper-alt: #E3DACB;
    --paper-card: #F5F0E6;
    --ink: #2E2A26;
    --ink-soft: #6B6259;
    --ink-faint: #9A9084;
    --wine: #7A2E3B;
    --wine-soft: #9C5A66;
    --gold: #9C7A34;
    --gold-soft: #B08D46;
    --sage: #4E5F4C;
    --sage-soft: #6E8069;
    --line: rgba(46, 42, 38, 0.12);
    --shadow: rgba(46, 32, 24, 0.16);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1E1B18;
      --paper-alt: #262220;
      --paper-card: #26221F;
      --ink: #EDE6DA;
      --ink-soft: #B3A99C;
      --ink-faint: #83786C;
      --wine: #D98A98;
      --wine-soft: #B96C7A;
      --gold: #D4B876;
      --gold-soft: #C7A55E;
      --sage: #9CBC96;
      --sage-soft: #7E9C7A;
      --line: rgba(237, 230, 218, 0.14);
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --paper: #1E1B18;
    --paper-alt: #262220;
    --paper-card: #26221F;
    --ink: #EDE6DA;
    --ink-soft: #B3A99C;
    --ink-faint: #83786C;
    --wine: #D98A98;
    --wine-soft: #B96C7A;
    --gold: #D4B876;
    --gold-soft: #C7A55E;
    --sage: #9CBC96;
    --sage-soft: #7E9C7A;
    --line: rgba(237, 230, 218, 0.14);
    --shadow: rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Public Sans', system-ui, -apple-system, sans-serif;
    padding-inline: 20px;
    padding-block: 40px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 760px; margin: 0 auto; }

  .eyebrow {
    display: flex; align-items: center; gap: 10px; justify-content: center;
    font-size: 12.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gold-soft); font-weight: 600;
  }
  .eyebrow::before, .eyebrow::after {
    content: ""; height: 1px; width: 28px; background: var(--gold-soft); opacity: 0.6;
  }

  header.page-header { text-align: center; padding-block: 8px 30px; }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic; font-weight: 500;
    font-size: clamp(30px, 6vw, 48px);
    line-height: 1.1; margin: 14px 0 16px; text-wrap: balance;
  }

  header.page-header p {
    font-size: 15px; line-height: 1.6; color: var(--ink-soft);
    max-width: 520px; margin: 0 auto; text-wrap: balance;
  }

  .toc {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin: 24px 0 8px;
  }
  .toc button {
    font-family: 'Public Sans', sans-serif;
    font-size: 12.5px; color: var(--ink-soft);
    background: var(--paper-alt); border: 1px solid var(--line);
    border-radius: 20px; padding: 6px 13px; cursor: pointer;
  }
  .toc button.active { background: var(--wine); color: var(--paper-card); border-color: var(--wine); }
  .toc button:hover:not(.active) { border-color: var(--gold-soft); color: var(--ink); }

  .pager {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    margin: 10px 0 34px; font-size: 13px; color: var(--ink-soft);
  }
  .pager button {
    background: var(--paper-alt); border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; font-family: 'Public Sans', sans-serif;
    font-size: 13px;
  }
  .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pager button:hover:not(:disabled) { border-color: var(--gold-soft); }

  .person {
    background: var(--paper-alt);
    border: 1px solid var(--line);
    border-top: 3px solid var(--wine);
    border-radius: 16px;
    padding: 26px;
    margin-bottom: 26px;
  }
  .person.accent-gold { border-top-color: var(--gold); }
  .person.accent-sage { border-top-color: var(--sage); }

  .person-head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }

  .person-photo {
    width: 64px; height: 64px; border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
    border: 2px solid var(--paper-card);
    box-shadow: 0 0 0 2px var(--line);
  }
  .person-initials {
    width: 64px; height: 64px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-family: 'Fraunces', Georgia, serif;
    font-size: 22px; font-weight: 500; color: var(--paper-card);
  }

  .person-name-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

  .person-name-wrap h3 {
    font-family: 'Fraunces', Georgia, serif; font-weight: 500;
    font-style: italic; font-size: 21px; margin: 0 0 2px;
    cursor: pointer;
  }
  .person-name-wrap h3:hover { color: var(--wine); }
  .person-name-wrap p {
    font-size: 12.5px; color: var(--ink-faint); margin: 0;
  }

  .msg-badge {
    font-family: 'Public Sans', sans-serif;
    font-size: 12px; font-weight: 600;
    color: var(--wine); background: var(--paper-card);
    border: 1px solid var(--line); border-radius: 20px;
    padding: 3px 10px; cursor: pointer; white-space: nowrap;
  }
  .msg-badge:hover { border-color: var(--wine-soft); }
  .msg-badge.empty { color: var(--ink-faint); }

  .compose textarea {
    width: 100%; min-height: 78px; resize: vertical;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--paper-card); color: var(--ink);
    font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.55;
    padding: 12px 14px; outline: none;
  }
  .compose textarea:focus { border-color: var(--wine-soft); }

  .compose-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 10px; gap: 10px; flex-wrap: wrap;
  }
  .char-hint { font-size: 12px; color: var(--ink-faint); }

  button.submit {
    background: var(--wine); color: var(--paper-card); border: none;
    border-radius: 9px; font-family: 'Public Sans', sans-serif;
    font-size: 13.5px; font-weight: 600; padding: 9px 18px; cursor: pointer;
  }
  button.submit:hover { opacity: 0.88; }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }
  button.submit:focus-visible, .toc button:focus-visible, .pager button:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px;
  }

  .status-line { font-size: 12px; color: var(--wine-soft); min-height: 15px; margin-top: 6px; }

  .wall {
    margin-top: 14px; max-height: 280px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    padding-right: 4px;
  }
  .wall[hidden] { display: none; }

  .msg-card {
    background: var(--paper-card); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px;
  }
  .msg-text {
    font-size: 13.5px; line-height: 1.55; color: var(--ink);
    white-space: pre-wrap; word-break: break-word; margin: 0 0 6px;
  }
  .msg-time { font-size: 11px; color: var(--ink-faint); text-align: right; }

  .wall-empty { font-size: 12.5px; color: var(--ink-faint); padding: 6px 2px; }

  footer.page-footer {
    text-align: center; margin-top: 30px; font-size: 12px; color: var(--ink-faint);
  }

  .loading-state {
    text-align: center; padding: 60px 20px; color: var(--ink-faint); font-size: 14px;
  }

  .config-banner {
    background: #7A2E3B; color: #F5F0E6; font-size: 13px; text-align: center;
    padding: 10px 16px; border-radius: 10px; margin-bottom: 20px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="page-header">
    <div class="eyebrow">ProBarranquilla</div>
    <h1>Un mensaje para cada uno</h1>
    <p>Busca a alguien y déjale un mensajito especial (tu mensaje se publica sin tu nombre).</p>
  </header>

  <div id="configBanner"></div>

  <nav class="toc" id="toc" aria-label="Ir a una página del mural"></nav>
  <div class="pager" id="pagerTop"></div>

  <main id="board">
    <div class="loading-state">Cargando el mural…</div>
  </main>

  <div class="pager" id="pagerBottom"></div>

  <footer class="page-footer">Hecho con cariño para el equipo de ProBarranquilla</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  // ------------------------------------------------------------------
  // 1) PEGA AQUÍ TUS DATOS DE SUPABASE (Project Settings > API)
  // ------------------------------------------------------------------
  var SUPABASE_URL = 'https://basfdhlsvcnzxjjyzeyx.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_qGwGoETIzmCjShJUZqC_yg_giLk57MZ';
  // ------------------------------------------------------------------

  var PAGE_SIZE = 5;
  var COLOR_KEYS = ['wine', 'gold', 'sage'];
  var COLOR_VARS = { wine: 'var(--wine)', gold: 'var(--gold)', sage: 'var(--sage)' };
  var ACCENT_CLASS = { wine: '', gold: 'accent-gold', sage: 'accent-sage' };

  // Lista del equipo (nombre + foto opcional). Para agregar o quitar personas,
  // edita este arreglo — el orden en que aparecen aquí es el orden en el mural.
  var PEOPLE = [
  {
    "id": "nathalie-daccarett",
    "name": "Nathalie Daccarett",
    "photo": null
  },
  {
    "id": "diana-romero",
    "name": "Diana Romero",
    "photo": null
  },
  {
    "id": "antonella-rivero",
    "name": "Antonella Rivero",
    "photo": null
  },
  {
    "id": "daniela-gutierrez",
    "name": "Daniela Gutiérrez",
    "photo": null
  },
  {
    "id": "angelica-bolivar",
    "name": "Angélica Bolívar",
    "photo": null
  },
  {
    "id": "diego-ramirez",
    "name": "Diego Ramírez",
    "photo": null
  },
  {
    "id": "maria-t-urueta",
    "name": "María T. Urueta",
    "photo": null
  },
  {
    "id": "sebastian-duarte",
    "name": "Sebastián Duarte",
    "photo": null
  },
  {
    "id": "veronica-gomez",
    "name": "Verónica Gómez",
    "photo": null
  },
  {
    "id": "vicky-osorio",
    "name": "Vicky Osorio",
    "photo": null
  },
  {
    "id": "kettys-camacho",
    "name": "Kettys Camacho",
    "photo": null
  },
  {
    "id": "maria-oviedo",
    "name": "María Oviedo",
    "photo": null
  },
  {
    "id": "shandry-ramos",
    "name": "Shandry Ramos",
    "photo": null
  },
  {
    "id": "estefania-venegas",
    "name": "Estefanía Venegas",
    "photo": null
  },
  {
    "id": "jose-garcia",
    "name": "José García",
    "photo": null
  },
  {
    "id": "mariana-romo",
    "name": "Mariana Romo",
    "photo": null
  },
  {
    "id": "nicole-mateus",
    "name": "Nicole Mateus",
    "photo": null
  },
  {
    "id": "sindy-campo",
    "name": "Sindy Campo",
    "photo": null
  },
  {
    "id": "alvaro-marceles",
    "name": "Álvaro Marceles",
    "photo": null
  }
];

  var messagesByRecipient = {};
  var openWalls = {};
  var currentPage = 0;
  var supabaseClient = null;

  var boardEl = document.getElementById('board');
  var tocEl = document.getElementById('toc');
  var pagerTopEl = document.getElementById('pagerTop');
  var pagerBottomEl = document.getElementById('pagerBottom');
  var configBanner = document.getElementById('configBanner');

  function colorForPerson(id) {
    var sum = 0;
    for (var i = 0; i < id.length; i++) sum += id.charCodeAt(i);
    return COLOR_KEYS[sum % COLOR_KEYS.length];
  }

  function initials(name) {
    var parts = name.trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function timeAgo(iso) {
    var diffMs = Date.now() - new Date(iso).getTime();
    var mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'justo ahora';
    if (mins < 60) return 'hace ' + mins + ' min';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return 'hace ' + hrs + ' h';
    var days = Math.floor(hrs / 24);
    return 'hace ' + days + ' d';
  }

  function totalPages() {
    return Math.max(1, Math.ceil(PEOPLE.length / PAGE_SIZE));
  }

  function renderPagers() {
    [pagerTopEl, pagerBottomEl].forEach(function (el) {
      el.innerHTML = '';
      var prev = document.createElement('button');
      prev.textContent = '← Anterior';
      prev.disabled = currentPage <= 0;
      prev.addEventListener('click', function () { goToPage(currentPage - 1); });

      var label = document.createElement('span');
      label.textContent = 'Página ' + (currentPage + 1) + ' de ' + totalPages();

      var next = document.createElement('button');
      next.textContent = 'Siguiente →';
      next.disabled = currentPage >= totalPages() - 1;
      next.addEventListener('click', function () { goToPage(currentPage + 1); });

      el.appendChild(prev);
      el.appendChild(label);
      el.appendChild(next);
    });
  }

  function renderToc() {
    tocEl.innerHTML = '';
    var pages = totalPages();
    for (var p = 0; p < pages; p++) {
      var start = p * PAGE_SIZE;
      var group = PEOPLE.slice(start, start + PAGE_SIZE);
      var b = document.createElement('button');
      b.textContent = (p + 1) + '. ' + group.map(function (person) {
        return person.name.split(' ')[0];
      }).join(', ');
      if (p === currentPage) b.classList.add('active');
      b.addEventListener('click', function (page) {
        return function () { goToPage(page); };
      }(p));
      tocEl.appendChild(b);
    }
  }

  function goToPage(p) {
    currentPage = Math.min(Math.max(0, p), totalPages() - 1);
    renderAll();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderAll() {
    renderToc();
    renderPagers();
    renderBoard();
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    var start = currentPage * PAGE_SIZE;
    var group = PEOPLE.slice(start, start + PAGE_SIZE);

    group.forEach(function (person) {
      var color = colorForPerson(person.id);
      var section = document.createElement('section');
      section.className = 'person ' + (ACCENT_CLASS[color] || '');

      var head = document.createElement('div');
      head.className = 'person-head';

      if (person.photo) {
        var img = document.createElement('img');
        img.className = 'person-photo';
        img.src = person.photo;
        img.alt = person.name;
        head.appendChild(img);
      } else {
        var av = document.createElement('div');
        av.className = 'person-initials';
        av.style.background = COLOR_VARS[color];
        av.textContent = initials(person.name);
        head.appendChild(av);
      }

      var msgs = messagesByRecipient[person.id] || [];

      var nameWrap = document.createElement('div');
      nameWrap.className = 'person-name-wrap';

      var nameRow = document.createElement('div');
      nameRow.className = 'person-name-row';

      var h3 = document.createElement('h3');
      h3.textContent = person.name;
      h3.title = 'Ver los mensajes que le han dejado';

      var badge = document.createElement('button');
      badge.type = 'button';
      badge.className = 'msg-badge' + (msgs.length === 0 ? ' empty' : '');
      badge.textContent = '💬 ' + msgs.length;

      nameRow.appendChild(h3);
      nameRow.appendChild(badge);

      var pTag = document.createElement('p');
      pTag.textContent = msgs.length === 0 ? 'Sé la primera persona en escribirle' : 'Toca el nombre o el ícono para ver los mensajes';
      nameWrap.appendChild(nameRow);
      nameWrap.appendChild(pTag);

      head.appendChild(nameWrap);
      section.appendChild(head);

      var compose = document.createElement('div');
      compose.className = 'compose';
      var textarea = document.createElement('textarea');
      textarea.maxLength = 500;
      textarea.placeholder = 'Escríbele algo bonito a ' + person.name.split(' ')[0] + '... (tu mensaje será anónimo)';
      compose.appendChild(textarea);

      var footer = document.createElement('div');
      footer.className = 'compose-footer';
      var hint = document.createElement('span');
      hint.className = 'char-hint';
      hint.textContent = '0 / 500';
      textarea.addEventListener('input', function () {
        hint.textContent = textarea.value.length + ' / 500';
      });
      var submit = document.createElement('button');
      submit.className = 'submit';
      submit.textContent = 'Dejar mensaje';
      footer.appendChild(hint);
      footer.appendChild(submit);
      compose.appendChild(footer);

      var status = document.createElement('div');
      status.className = 'status-line';
      compose.appendChild(status);

      submit.addEventListener('click', function () {
        var text = textarea.value.trim();
        if (!text) { status.textContent = 'Escribe algo antes de publicarlo.'; return; }
        if (!supabaseClient) { status.textContent = 'El mural no está conectado (falta configurar Supabase).'; return; }
        submit.disabled = true;
        status.textContent = 'Publicando…';
        supabaseClient.from('messages').insert({
          recipient_id: person.id,
          text: text
        }).then(function (res) {
          if (res.error) throw res.error;
          textarea.value = '';
          hint.textContent = '0 / 500';
          status.textContent = '¡Mensaje publicado!';
          setTimeout(function () { status.textContent = ''; }, 2200);
        }).catch(function (err) {
          status.textContent = 'No se pudo publicar (' + (err && err.message || 'error') + ').';
        }).finally(function () {
          submit.disabled = false;
        });
      });

      section.appendChild(compose);

      var wall = document.createElement('div');
      wall.className = 'wall';
      wall.hidden = !openWalls[person.id];
      if (msgs.length === 0) {
        var emptyLine = document.createElement('div');
        emptyLine.className = 'wall-empty';
        emptyLine.textContent = 'Todavía no le han dejado mensajes.';
        wall.appendChild(emptyLine);
      } else {
        msgs.forEach(function (m) {
          var card = document.createElement('div');
          card.className = 'msg-card';
          var t = document.createElement('p');
          t.className = 'msg-text';
          t.textContent = m.text;
          var time = document.createElement('div');
          time.className = 'msg-time';
          time.textContent = m.created_at ? timeAgo(m.created_at) : '';
          card.appendChild(t);
          card.appendChild(time);
          wall.appendChild(card);
        });
      }
      section.appendChild(wall);

      function toggleWall() {
        openWalls[person.id] = !openWalls[person.id];
        wall.hidden = !openWalls[person.id];
      }
      h3.addEventListener('click', toggleWall);
      badge.addEventListener('click', toggleWall);

      boardEl.appendChild(section);
    });
  }

  function groupMessages(rows) {
    var grouped = {};
    rows.forEach(function (row) {
      if (!grouped[row.recipient_id]) grouped[row.recipient_id] = [];
      grouped[row.recipient_id].push(row);
    });
    Object.keys(grouped).forEach(function (id) {
      grouped[id].sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
    });
    return grouped;
  }

  function boot() {
    renderAll();

    if (!SUPABASE_URL || SUPABASE_URL.indexOf('PEGA_AQUI') === 0 || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.indexOf('PEGA_AQUI') === 0) {
      configBanner.innerHTML = '<div class="config-banner">Falta conectar Supabase: edita SUPABASE_URL y SUPABASE_ANON_KEY al inicio del &lt;script&gt; de este archivo. Mientras tanto, los mensajes no se guardan.</div>';
      return;
    }

    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    supabaseClient.from('messages').select('*').then(function (res) {
      if (res.error) {
        configBanner.innerHTML = '<div class="config-banner">No se pudo conectar con la base de datos (' + res.error.message + ').</div>';
        return;
      }
      messagesByRecipient = groupMessages(res.data || []);
      renderBoard();
    });

    supabaseClient
      .channel('messages-changes')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, function (payload) {
        var row = payload.new;
        if (!messagesByRecipient[row.recipient_id]) messagesByRecipient[row.recipient_id] = [];
        messagesByRecipient[row.recipient_id].unshift(row);
        renderBoard();
      })
      .subscribe();
  }

  boot();
})();
</script>
</body>
</html>
